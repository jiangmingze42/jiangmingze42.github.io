<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Single-pulse volumetric fluorescence lifetime microscopy</title>
  <desc id="desc">A scientific illustration showing a single excitation pulse, photon-efficient lifetime decay estimation, and a volumetric fluorescence lifetime map.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071b32"/>
      <stop offset="1" stop-color="#123c55"/>
    </linearGradient>
    <linearGradient id="spectrum" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2474d2"/>
      <stop offset="0.35" stop-color="#28d7cf"/>
      <stop offset="0.67" stop-color="#f4d74c"/>
      <stop offset="1" stop-color="#f25a42"/>
    </linearGradient>
    <radialGradient id="cellA">
      <stop offset="0" stop-color="#ffd75a" stop-opacity=".95"/>
      <stop offset=".55" stop-color="#21d4c8" stop-opacity=".8"/>
      <stop offset="1" stop-color="#2679d5" stop-opacity=".08"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>

  <rect width="1200" height="650" rx="22" fill="url(#bg)"/>
  <path d="M400 95V555M790 95V555" stroke="#d7f6ff" stroke-opacity=".13" stroke-width="2"/>

  <!-- Single excitation pulse -->
  <g transform="translate(55 95)">
    <text x="145" y="12" fill="#d8edf3" font-family="Arial, sans-serif" font-size="28" text-anchor="middle">SINGLE PULSE</text>
    <path d="M0 275H290" stroke="#7ca7b8" stroke-opacity=".55" stroke-width="3"/>
    <path d="M10 275C90 275 108 274 127 266C145 258 149 124 157 70C165 124 170 258 188 266C206 274 224 275 280 275" fill="none" stroke="#55e2ff" stroke-width="7" filter="url(#glow)"/>
    <g fill="#fff1a8" filter="url(#glow)">
      <circle cx="102" cy="328" r="5"/><circle cx="132" cy="350" r="4"/><circle cx="162" cy="319" r="5"/>
      <circle cx="191" cy="344" r="4"/><circle cx="218" cy="324" r="5"/><circle cx="250" cy="354" r="4"/>
    </g>
    <text x="145" y="405" fill="#8fb4c1" font-family="Arial, sans-serif" font-size="22" text-anchor="middle">low photon exposure</text>
  </g>

  <!-- Temporal sampling and lifetime fit -->
  <g transform="translate(435 95)">
    <text x="160" y="12" fill="#d8edf3" font-family="Arial, sans-serif" font-size="28" text-anchor="middle">LIFETIME DECAY</text>
    <path d="M15 400V80M15 400H320" stroke="#7ca7b8" stroke-opacity=".5" stroke-width="3"/>
    <path d="M22 105C52 125 78 150 105 183C147 235 198 310 312 378" fill="none" stroke="#f9cf52" stroke-width="6"/>
    <path d="M22 105C65 145 104 191 146 241C197 302 246 349 312 385" fill="none" stroke="#39d6c6" stroke-width="5" stroke-opacity=".9"/>
    <g fill="#effcff">
      <circle cx="31" cy="116" r="5"/><circle cx="58" cy="137" r="4"/><circle cx="87" cy="170" r="5"/>
      <circle cx="119" cy="203" r="4"/><circle cx="151" cy="251" r="5"/><circle cx="184" cy="283" r="4"/>
      <circle cx="220" cy="330" r="5"/><circle cx="260" cy="352" r="4"/><circle cx="299" cy="382" r="5"/>
    </g>
    <text x="165" y="448" fill="#8fb4c1" font-family="Arial, sans-serif" font-size="22" text-anchor="middle">photon-efficient estimation</text>
  </g>

  <!-- Volumetric lifetime map -->
  <g transform="translate(820 78)">
    <text x="160" y="29" fill="#d8edf3" font-family="Arial, sans-serif" font-size="28" text-anchor="middle">VOLUMETRIC FLIM</text>
    <g transform="translate(15 70)" filter="url(#soft)" opacity=".5">
      <ellipse cx="164" cy="190" rx="144" ry="125" fill="url(#cellA)"/>
    </g>
    <g transform="translate(15 70)">
      <path d="M44 219C47 140 106 80 180 82C258 84 304 148 286 225C268 300 200 338 127 313C71 294 42 267 44 219Z" fill="#11608b" fill-opacity=".35" stroke="#6fe5e4" stroke-opacity=".5" stroke-width="3"/>
      <ellipse cx="122" cy="178" rx="62" ry="48" fill="url(#cellA)"/>
      <ellipse cx="205" cy="224" rx="68" ry="58" fill="url(#cellA)"/>
      <ellipse cx="154" cy="267" rx="50" ry="38" fill="#f36b49" fill-opacity=".72"/>
      <circle cx="102" cy="164" r="15" fill="#fff0a2"/>
      <circle cx="220" cy="210" r="18" fill="#50e2d1"/>
      <circle cx="166" cy="267" r="12" fill="#ffcf55"/>
      <path d="M62 306L95 275M248 126L276 97M239 295L275 327" stroke="#71e8df" stroke-width="7" stroke-linecap="round" opacity=".65"/>
    </g>
    <rect x="43" y="438" width="264" height="14" rx="7" fill="url(#spectrum)"/>
    <text x="42" y="482" fill="#8fb4c1" font-family="Arial, sans-serif" font-size="18">short lifetime</text>
    <text x="307" y="482" fill="#8fb4c1" font-family="Arial, sans-serif" font-size="18" text-anchor="end">long lifetime</text>
  </g>
</svg>
